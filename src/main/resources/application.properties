spring.application.name=zbagentwf
spring.config.import=optional:file:./config/project.properties,optional:file:./config/agents.properties
spring.main.web-application-type=servlet
spring.main.banner-mode=off
server.address=127.0.0.1
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.tomcat.accesslog.enabled=false
spring.sql.init.mode=never
logging.level.root=INFO
logging.level.com.kk24426.zbagentwf=DEBUG
# Mapper SQL 参数不能随项目 DEBUG 级别输出。
logging.level.com.kk24426.zbagentwf.agent.persistence.mapper=INFO
