name: Codex user 包自动实现

on:
  push:
    branches: [main]
    paths: ['src/main/java/com/kk24426/zbagentwf/user/**']
  workflow_dispatch:
    inputs:
      base_sha:
        description: '累计待实现 user 差异的起点（main 祖先的完整 SHA）'
        required: true
        type: string

permissions:
  contents: read

# 已运行任务保留证据；新任务会从上次成功实现提交累计 user 净差异。
concurrency:
  group: codex-user-main
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  proposal:
    if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 检查模型配置
        env:
          MODEL_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$MODEL_KEY" || { echo '请在仓库 Actions Secrets 设置 OPENAI_API_KEY；Codex 云登录不能代替此密钥。' >&2; exit 1; }
      - name: 检查自动化并生成用户差异
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s .github/tests -v
          cp .github/scripts/codex_automation.py "$RUNNER_TEMP/automation.py"
          python3 "$RUNNER_TEMP/automation.py" packet "$RUNNER_TEMP/bundle" --phase proposal
      - name: 只读制定具体实施计划
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: ${{ vars.CODEX_MODEL }}
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          prompt-file: ${{ runner.temp }}/bundle/proposal-prompt.md
          output-file: ${{ runner.temp }}/bundle/proposal.md
      - name: 上传前检查任务材料
        id: materials
        if: always()
        run: python3 "$RUNNER_TEMP/automation.py" scan-bundle "$RUNNER_TEMP/bundle"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.materials.outcome == 'success'
        with:
          name: proposal-${{ github.run_id }}
          path: ${{ runner.temp }}/bundle/
          retention-days: 7
          if-no-files-found: error

  plan_review:
    needs: proposal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: proposal-${{ github.run_id }}
          path: ${{ runner.temp }}/bundle/
      - name: 准备独立计划评审
        run: |
          cp .github/scripts/codex_automation.py "$RUNNER_TEMP/automation.py"
          python3 "$RUNNER_TEMP/automation.py" packet "$RUNNER_TEMP/bundle" --phase plan-review
      - name: 独立只读 Plan Review
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: ${{ vars.CODEX_MODEL }}
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          prompt-file: ${{ runner.temp }}/bundle/plan-review-prompt.md
          output-file: ${{ runner.temp }}/bundle/plan-review.json
          output-schema-file: .github/codex/review.schema.json
      - name: 强制计划审核门禁
        run: python3 "$RUNNER_TEMP/automation.py" review "$RUNNER_TEMP/bundle" --phase plan
      - name: 上传前检查任务材料
        id: materials
        if: always()
        run: python3 "$RUNNER_TEMP/automation.py" scan-bundle "$RUNNER_TEMP/bundle"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.materials.outcome == 'success'
        with:
          name: plan-${{ github.run_id }}
          path: ${{ runner.temp }}/bundle/
          retention-days: 7
          if-no-files-found: error

  implement:
    needs: plan_review
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.candidate.outputs.changed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: plan-${{ github.run_id }}
          path: ${{ runner.temp }}/bundle/
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '26'
      - name: 准备已批准任务与离线模型所需依赖
        run: |
          cp .github/scripts/codex_automation.py "$RUNNER_TEMP/automation.py"
          python3 "$RUNNER_TEMP/automation.py" packet "$RUNNER_TEMP/bundle" --phase implement
          ./mvnw -B dependency:go-offline
      - name: 按用户契约实施
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: ${{ vars.CODEX_MODEL }}
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          prompt-file: ${{ runner.temp }}/bundle/implement-prompt.md
          output-file: ${{ runner.temp }}/bundle/implementation.json
          output-schema-file: .github/codex/implementation.schema.json
      - name: 核验实现边界并运行完整回归
        run: |
          python3 "$RUNNER_TEMP/automation.py" guard "$RUNNER_TEMP/bundle"
          set -o pipefail
          ./mvnw -B clean verify 2>&1 | tee "$RUNNER_TEMP/bundle/verify.log"
      - name: 生成最终 staged snapshot
        id: candidate
        run: python3 "$RUNNER_TEMP/automation.py" candidate "$RUNNER_TEMP/bundle"
      - name: 上传前检查任务材料
        id: materials
        if: always()
        run: python3 "$RUNNER_TEMP/automation.py" scan-bundle "$RUNNER_TEMP/bundle"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.materials.outcome == 'success'
        with:
          name: candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/bundle/
          retention-days: 7
          if-no-files-found: error

  result_review:
    needs: implement
    if: needs.implement.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/bundle/
      - name: 重建精确候选并准备结果审核
        run: |
          cp .github/scripts/codex_automation.py "$RUNNER_TEMP/automation.py"
          python3 "$RUNNER_TEMP/automation.py" apply "$RUNNER_TEMP/bundle"
          python3 "$RUNNER_TEMP/automation.py" packet "$RUNNER_TEMP/bundle" --phase result-review
      - name: 独立只读 Result Review
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: ${{ vars.CODEX_MODEL }}
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          prompt-file: ${{ runner.temp }}/bundle/result-review-prompt.md
          output-file: ${{ runner.temp }}/bundle/result-review.json
          output-schema-file: .github/codex/review.schema.json
      - name: 强制结果审核及快照复核
        run: |
          python3 "$RUNNER_TEMP/automation.py" review "$RUNNER_TEMP/bundle" --phase result
          python3 "$RUNNER_TEMP/automation.py" assert "$RUNNER_TEMP/bundle"
      - name: 上传前检查任务材料
        id: materials
        if: always()
        run: python3 "$RUNNER_TEMP/automation.py" scan-bundle "$RUNNER_TEMP/bundle"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.materials.outcome == 'success'
        with:
          name: reviewed-${{ github.run_id }}
          path: ${{ runner.temp }}/bundle/
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: result_review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 唯一可写回的 job 不运行模型，也不接收模型 API key。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: reviewed-${{ github.run_id }}
          path: ${{ runner.temp }}/bundle/
      - name: 仅回推已审核的原始候选
        run: |
          cp .github/scripts/codex_automation.py "$RUNNER_TEMP/automation.py"
          python3 "$RUNNER_TEMP/automation.py" apply "$RUNNER_TEMP/bundle"
          python3 "$RUNNER_TEMP/automation.py" publish "$RUNNER_TEMP/bundle"
